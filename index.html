
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Notes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f4f8;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        p {
            color: #666;
            text-align: center;
        }

        textarea {
            width: 100%;
            min-height: 250px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #6c63ff;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #574fe0;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            color: #16803c;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Shared Notes</h1>

        <p>Write anything you want and save it!</p>

        <textarea
            id="textBox"
            placeholder="Start writing here..."
        ></textarea>

        <button onclick="saveText()">Save Text</button>

        <p id="status"></p>

    </div>

    <script>
        const textBox = document.getElementById("textBox");
        const status = document.getElementById("status");

        // Load previously saved text
        window.onload = function () {
            const savedText = localStorage.getItem("savedText");

            if (savedText !== null) {
                textBox.value = savedText;
            }
        };

        // Save text to the browser
        function saveText() {
            localStorage.setItem("savedText", textBox.value);

            status.textContent = "Text saved successfully!";
        }
    </script>

</body>
</html>
